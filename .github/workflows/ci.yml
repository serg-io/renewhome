name: 'CI'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build container image if necessary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v2

      - name: Detect container relevant changes
        id: detect_changes
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            .devcontainer/**/*
          FILES: |
            requirements.txt
          # package.json is not baked into the container yet

      - name: Set up Docker BuildKit
        uses: docker/setup-buildx-action@v1
        # skip this step if there's no diff found in detect_changes step
        if: env.GIT_DIFF

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        # skip this step if there's no diff found in detect_changes step
        if: env.GIT_DIFF

      - name: Build and Push Devcontainer
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          # only push if on main
          push: ${{ github.ref == 'refs/heads/main'}}
          #
          tags: ghcr.io/renewhome-assessment/full-stack-assessment-devcontainer:latest
          context: .
          file: .devcontainer/Dockerfile
          build-args: |
            VARIANT=3.8
            NODE_VERSION=lts/*
        # skip this step if there's no diff found in detect_changes step
        if: env.GIT_DIFF && github.ref == 'refs/heads/main' && github.repository == 'renewhome-assessment/assessment-template'

  backend-test:
    name: Backend Tests
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renewhome-assessment/full-stack-assessment-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        MYSQL_PWD: test
        FLASK_ENV: test

    services:
      db:
        image: public.ecr.aws/bitnami/mysql:8.0.27
        env:
          ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: abc
          MYSQL_AUTHENTICATION_PLUGIN: mysql_native_password
          TZ: UTC
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v2

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Detect backend test relevant changes
        id: detect_changes
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            backend/**/*

      - name: Setup MySQL
        run: |
          mysql --version
          mysql --host db --verbose --user root <.devcontainer/config/mysql/init.sql

      - name: Migrate test database
        run: cd backend && alembic upgrade heads

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Python Tests
        run: pytest

      - name: Python Test Coverage
        id: pytester-cov
        uses: programmingwithalex/pytester-cov@main
        with:
          pytest-root-dir: 'backend'
          cov-omit-list: 'test/*, alembic/*'
          cov-threshold-single: 70
          cov-threshold-total: 70

  frontend-test:
    name: Frontend Tests
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renewhome-assessment/full-stack-assessment-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v2

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Detect frontend test relevant changes
        id: detect_changes
        uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            frontend/**/*

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: npm install
        run: npm ci
        working-directory: ./frontend

      - name: Run Frontend Tests
        run: npm run test
        working-directory: ./frontend
