name: 'Manual push and rebuild container'
on: # rebuild any PRs and main branch changes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: Build and push docker container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (GitHub)
        uses: actions/checkout@v2

      - name: Set up Docker BuildKit
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Devcontainer
        if: github.ref == 'refs/heads/main' && github.repository == 'renewhome-assessment/assessment-template'
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          # only push if on main
          push: ${{ github.ref == 'refs/heads/main'}}
          #
          tags: ghcr.io/renewhome-assessment/full-stack-assessment-devcontainer:latest
          context: .
          file: .devcontainer/Dockerfile
          build-args: |
            VARIANT=3.8
            NODE_VERSION=lts/*
